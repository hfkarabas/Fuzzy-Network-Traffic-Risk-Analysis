[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzy-network-risk"
dynamic = ["version"]
requires-python = ">=3.12"
description = "Reproducible CIC-IDS2017 preparation for interpretable fuzzy risk analysis"
# Abstract, compatible ranges. Exact reproducible pins (including transitive
# packages) are in the requirements*.txt lock files, one per installation profile:
#   requirements.txt          core engine        ->  pip install .
#   requirements-web.txt      + local web app     ->  pip install .[web]
#   requirements-live.txt     + packet capture    ->  pip install .[live]
#   requirements-research.txt + data/research     ->  pip install .[research]
#   requirements-dev.txt      everything + tests  ->  pip install .[dev]
dependencies = [
    "numpy>=2.5,<3",
    "pandas>=3.1,<4",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.162,<1",
    "uvicorn>=0.54,<1",
]
live = [
    "fuzzy-network-risk[web]",
    "scapy>=2.8,<3",
]
research = [
    "pyarrow>=26",
    "duckdb>=2",
    "PyYAML>=6",
    "datasets>=5.1",
    "huggingface_hub>=2.4",
    "matplotlib>=3.11",
]
dev = [
    "fuzzy-network-risk[live,research]",
    "pytest>=9.2",
    "httpx>=0.28",
    "ruff>=0.17,<0.18",
]

[tool.setuptools.dynamic]
version = {attr = "fuzzy_network_risk.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts", "scripts/data", "scripts/research"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
# Archived, hash-registered research and data pipelines (see scripts/README.md)
# keep their recorded form; they are only checked for real errors (pyflakes).
extend-exclude = ["web", "reports", "datasets", "data", ".cache", ".tmp"]

[tool.ruff.format]
quote-style = "single"
exclude = [
    "scripts/data/**", "scripts/fuzzy/**", "scripts/research/**", "scripts/validation/**",
    "scripts/webapp/build_web_catalog.py", "scripts/webapp/validate_web_catalog.py",
    "scripts/webapp/validate_web_http.py", "scripts/webapp/summarize_web_validation.py",
]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade.
select = ["E", "W", "F", "I", "B", "UP"]
# The formatter enforces line length; what remains are unsplittable literals.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/data/**" = ["E", "W", "I", "B", "UP", "F841"]
"scripts/fuzzy/**" = ["E", "W", "I", "B", "UP", "F841"]
"scripts/research/**" = ["E", "W", "I", "B", "UP", "F841"]
"scripts/validation/**" = ["E", "W", "I", "B", "UP"]
"scripts/webapp/build_web_catalog.py" = ["E", "W", "I", "B", "UP"]
"scripts/webapp/validate_web_catalog.py" = ["E", "W", "I", "B", "UP"]
"scripts/webapp/validate_web_http.py" = ["E", "W", "I", "B", "UP"]
"scripts/webapp/summarize_web_validation.py" = ["E", "W", "I", "B", "UP"]
# Scripts put src/ on sys.path before importing the package.
"scripts/*.py" = ["E402"]
"scripts/webapp/build_web_test_fixture.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["fuzzy_network_risk"]
